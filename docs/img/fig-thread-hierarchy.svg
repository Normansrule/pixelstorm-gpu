/text><text x="494" y="186" font-size="11" text-anchor="start" class="mono ink2" >warp 1</text><rect x="544" y="172" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="552" y="187" font-size="8.5" text-anchor="middle" class="mono" >40</text><rect x="562.5" y="172" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="570.5" y="187" font-size="8.5" text-anchor="middle" class="mono" >41</text><rect x="581" y="172" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="589" y="187" font-size="8.5" text-anchor="middle" class="mono" >42</text><rect x="599.5" y="172" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="607.5" y="187" font-size="8.5" text-anchor="middle" class="mono" >43</text><rect x="618" y="172" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="626" y="187" font-size="8.5" text-anchor="middle" class="mono" >44</text><rect x="636.5" y="172" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="644.5" y="187" font-size="8.5" text-anchor="middle" class="mono" >45</text><rect x="655" y="172" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="663" y="187" font-size="8.5" text-anchor="middle" class="mono" >46</text><rect x="673.5" y="172" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="681.5" y="187" font-size="8.5" text-anchor="middle" class="mono" >47</text><rect x="710" y="102" width="214" height="106" rx="6" class="tv" /><text x="720" y="122" font-size="14" text-anchor="start" class="h" >Block 3  (blockIdx.x = 3)</text><text x="720" y="150" font-size="11" text-anchor="start" class="mono ink2" >warp 0</text><rect x="770" y="136" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="778" y="151" font-size="8.5" text-anchor="middle" class="mono" >48</text><rect x="788.5" y="136" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="796.5" y="151" font-size="8.5" text-anchor="middle" class="mono" >49</text><rect x="