<text x="20" y="32" font-size="22" text-anchor="start" class="h" >From a CUDA launch to hardware: vector_add&lt;&lt;&lt;4, 16&gt;&gt;&gt;</text><text x="20" y="52" font-size="13" text-anchor="start" class="ink2" >4 blocks of 16 threads. Each block becomes 2 warps of 8 lanes; the dispatcher hands blocks to whichever SM is free.</text><rect x="20" y="70" width="920" height="150" rx="8" class="panel" /><text x="32" y="92" font-size="16" text-anchor="start" class="h" >Grid (the whole launch): threads 0 to 63</text><rect x="32" y="102" width="214" height="106" rx="6" class="tb" /><text x="42" y="122" font-size="14" text-anchor="start" class="h" >Block 0  (blockIdx.x = 0)</text><text x="42" y="150" font-size="11" text-anchor="start" class="mono ink2" >warp 0</text><rect x="92" y="136" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="100" y="151" font-size="8.5" text-anchor="middle" class="mono" >0</text><rect x="110.5" y="136" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="118.5" y="151" font-size="8.5" text-anchor="middle" class="mono" >1</text><rect x="129" y="136" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="137" y="151" font-size="8.5" text-anchor="middle" class="mono" >2</text><rect x="147.5" y="136" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="155.5" y="151" font-size="8.5" text-anchor="middle" class="mono" >3</text><rect x="166" y="136" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="174" y="151" font-size="8.5" text-anchor="middle" class="mono" >4</text><rect x="184.5" y="136" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="192.5" y="151" font-size="8.5" text-anchor="middle" class="mono" >5</text><rect x="203" y="136" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="211" y="151" font-size="8.5" text-anchor="middle" class="mono" >6</text><rect x="221.5" y="136" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="229.5" y="151" font-size="8.5" text-anchor="middle" class="mono" >7</text><text x="42" y="186" font-size="11" text-anchor="start" class="mono ink2" >warp 1</text><rect x="92" y="172" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="100" y="187" font-size="8.5" text-anchor="middle" class="mono" >8</text><rect x="110.5" y="172" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="118.5" y="187" font-size="8.5" text-anchor="middle" class="mono" >9</text><rect x="129" y="172" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="137" y="187" font-size="8.5" text-anchor="middle" class="mono" >10</text><rect x="147.5" y="172" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="155.5" y="187" font-size="8.5" text-anchor="middle" class="mono" >11</text><rect x="166" y="172" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="174" y="187" font-size="8.5" text-anchor="middle" class="mono" >12</text><rect x="184.5" y="172" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="192.5" y="187" font-size="8.5" text-anchor="middle" class="mono" >13</text><rect x="203" y="172" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="211" y="187" font-size="8.5" text-anchor="middle" class="mono" >14</text><rect x="221.5" y="172" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="229.5" y="187" font-size="8.5" text-anchor="middle" class="mono" >15</text><rect x="258" y="102" width="214" height="106" rx="6" class="tg" /><text x="268" y="122" font-size="14" text-anchor="start" class="h" >Block 1  (blockIdx.x = 1)</text><text x="268" y="150" font-size="11" text-anchor="start" class="mono ink2" >warp 0</text><rect x="318" y="136" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="326" y="151" font-size="8.5" text-anchor="middle" class="mono" >16</text><rect x="336.5" y="136" width="16" height="22" rx="3" class="w" stroke-width="1"/><text x="344.5" y="151" font-si