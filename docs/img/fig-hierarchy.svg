<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-label="GPU memory hierarchy">
<title>GPU memory hierarchy</title>
<style>
  .bg{fill:#F7F9FB} .panel{fill:#FFFFFF;stroke:#C9D1DA} .well{fill:#EEF2F6} .box{fill:#EEF2F6;stroke:#C9D1DA;stroke-width:1.2}
  .ink{fill:#182231} .ink2{fill:#4A5566} .ink3{fill:#7C8898} .ln{stroke:#C9D1DA;fill:none} .lnd{stroke:#4A5566;fill:none}
  .fb{fill:#2B57E0} .fg{fill:#13936A} .fa{fill:#D99A06} .fm{fill:#C8325F} .fv{fill:#7A4FD6} .fs{fill:#6B7A90} .fw{fill:#FFFFFF}
  .sb{stroke:#2B57E0;fill:none} .sg{stroke:#13936A;fill:none} .sa{stroke:#D99A06;fill:none} .sm{stroke:#C8325F;fill:none} .sv{stroke:#7A4FD6;fill:none}
  .tb{fill:rgba(43,87,224,.12);stroke:#2B57E0} .tg{fill:rgba(19,147,106,.16);stroke:#13936A} .ta{fill:rgba(217,154,6,.18);stroke:#D99A06}
  .tm{fill:rgba(200,50,95,.12);stroke:#C8325F} .tv{fill:rgba(122,79,214,.14);stroke:#7A4FD6} .ts{fill:rgba(107,122,144,.14);stroke:#6B7A90}
  text{font-family:'Barlow','Segoe UI',Helvetica,Arial,sans-serif;fill:#182231}
  .h{font-family:'Barlow Condensed','Arial Narrow','Segoe UI',sans-serif;font-weight:600}
  .mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
  .w{fill:#FFFFFF}
  @media (prefers-color-scheme: dark){
    .bg{fill:#16202A} .panel{fill:#0F151C;stroke:#2A3845} .well{fill:#1C2733} .box{fill:#1C2733;stroke:#2A3845}
    .ink,text{fill:#E3E9EF} .ink2{fill:#9AA8B8} .ink3{fill:#6D7C8C} .ln{stroke:#2A3845} .lnd{stroke:#9AA8B8}
    .fb{fill:#5B84FF} .fg{fill:#2DBE8C} .fa{fill:#F0B429} .fm{fill:#E5587F} .fv{fill:#A07DF0} .fs{fill:#8594A8}
    .sb{stroke:#5B84FF} .sg{stroke:#2DBE8C} .sa{stroke:#F0B429} .sm{stroke:#E5587F} .sv{stroke:#A07DF0}
    .tb{fill:rgba(91,132,255,.18);stroke:#5B84FF} .tg{fill:rgba(45,190,140,.18);stroke:#2DBE8C} .ta{fill:rgba(240,180,41,.18);stroke:#F0B429}
    .tm{fill:rgba(229,88,127,.16);stroke:#E5587F} .tv{fill:rgba(160,125,240,.18);stroke:#A07DF0} .ts{fill:rgba(133,148,168,.18);stroke:#8594A8}
    .w{fill:#0F151C}
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink2"/></marker>
  <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fa"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fb"/></marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="well"/><line x1="0" y1="0" x2="0" y2="6" class="lnd" stroke-width="1" opacity=".5"/></pattern>
</defs>
<rect width="960" height="410" class="bg"/>
<text x="20" y="32" font-size="22" text-anchor="start" class="h" >Memory hierarchy: size grows, speed drops</text><path d="M200,126 L380,126 L340,60 L240,60 Z" class="tg" stroke-width="1.5"/><text x="290" y="86" font-size="17" text-anchor="middle" class="h" >Registers</text><text x="290" y="106" font-size="12.5" text-anchor="middle" class="ink2" >per thread</text><text x="580" y="86" font-size="12" text-anchor="start" class="mono" >Pixelstorm: 16 x 32 bit, 1 cycle</text><text x="580" y="106" font-size="12" text-anchor="start" class="mono ink2" >H100 (approx.): 255 x 32 bit, ~1 cycle</text><line x1="360" y1="93" x2="572" y2="93" class="ln" stroke-width="1"  /><path d="M150,202 L430,202 L390,136 L190,136 Z" class="ta" stroke-width="1.5"/><text x="290" y="162" font-size="17" text-anchor="middle" class="h" >Shared memory</text><text x="290" y="182" font-size="12.5" text-anchor="middle" class="ink2" >per block, on the SM</text><text x="580" y="162" font-size="12" text-anchor="start" class="mono" >Pixelstorm: 256 words, 1 cycle per bank pass</text><text x="580" y="182" font-size="12" text-anchor="start" class="mono ink2" >H100 (approx.): up to 228 KB, ~20-30 cycles</text><line x1="410" y1="169" x2="572" y2="169" class="ln" stroke-width="1"  /><path d="M100,278 L480,278 L440,212 L140,212 Z" class="ts" stroke-width="1.5"/><text x="290" y="238" font-size="17" text-anchor="middle" class="h" >L1 / L2 cache</text><text x="290" y="258" font-size="12.5" text-anchor="middle" class="ink2" >per SM / whole chip</text><text x="580" y="238" font-size="12" text-anchor="start" class="mono" >Pixelstorm: none (exercise 3)</text><text x="580" y="258" font-size="12" text-anchor="start" class="mono ink2" >H100 (approx.): 256 KB L1 per SM, 50 MB L2</text><line x1="460" y1="245" x2="572" y2="245" class="ln" stroke-width="1"  /><path d="M50,354 L530,354 L490,288 L90,288 Z" class="tb" stroke-width="1.5"/><text x="290" y="314" font-size="17" text-anchor="middle" class="h" >Global memory (DRAM)</text><text x="290" y="334" font-size="12.5" text-anchor="middle" class="ink2" >whole GPU</text><text x="580" y="314" font-size="12" text-anchor="start" class="mono" >Pixelstorm: 64K words, 8 cycles + queueing</text><text x="580" y="334" font-size="12" text-anchor="start" class="mono ink2" >H100 (approx.): 80 GB HBM3, ~400-600 cycles, 3.35 TB/s</text><line x1="510" y1="321" x2="572" y2="321" class="ln" stroke-width="1"  /><text x="20" y="390" font-size="12" text-anchor="start" class="ink3" >Latencies for real GPUs vary by product and access; treat them as orders of magnitude, measured with microbenchmarks in published studies.</text>
</svg>
