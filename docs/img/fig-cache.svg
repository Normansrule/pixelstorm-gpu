<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 454" width="960" height="454" role="img" aria-label="Cycles and DRAM trips with and without the cache">
<title>Cycles and DRAM trips with and without the cache</title>
<style>
  .bg{fill:#F7F9FB} .panel{fill:#FFFFFF;stroke:#C9D1DA} .well{fill:#EEF2F6} .box{fill:#EEF2F6;stroke:#C9D1DA;stroke-width:1.2}
  .ink{fill:#182231} .ink2{fill:#4A5566} .ink3{fill:#7C8898} .ln{stroke:#C9D1DA;fill:none} .lnd{stroke:#4A5566;fill:none}
  .fb{fill:#2B57E0} .fg{fill:#13936A} .fa{fill:#D99A06} .fm{fill:#C8325F} .fv{fill:#7A4FD6} .fs{fill:#6B7A90} .fw{fill:#FFFFFF}
  .sb{stroke:#2B57E0;fill:none} .sg{stroke:#13936A;fill:none} .sa{stroke:#D99A06;fill:none} .sm{stroke:#C8325F;fill:none} .sv{stroke:#7A4FD6;fill:none}
  .tb{fill:rgba(43,87,224,.12);stroke:#2B57E0} .tg{fill:rgba(19,147,106,.16);stroke:#13936A} .ta{fill:rgba(217,154,6,.18);stroke:#D99A06}
  .tm{fill:rgba(200,50,95,.12);stroke:#C8325F} .tv{fill:rgba(122,79,214,.14);stroke:#7A4FD6} .ts{fill:rgba(107,122,144,.14);stroke:#6B7A90}
  text{font-family:'Barlow','Segoe UI',Helvetica,Arial,sans-serif;fill:#182231}
  .h{font-family:'Barlow Condensed','Arial Narrow','Segoe UI',sans-serif;font-weight:600}
  .mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
  .w{fill:#FFFFFF}
  @media (prefers-color-scheme: dark){
    .bg{fill:#16202A} .panel{fill:#0F151C;stroke:#2A3845} .well{fill:#1C2733} .box{fill:#1C2733;stroke:#2A3845}
    .ink,text{fill:#E3E9EF} .ink2{fill:#9AA8B8} .ink3{fill:#6D7C8C} .ln{stroke:#2A3845} .lnd{stroke:#9AA8B8}
    .fb{fill:#5B84FF} .fg{fill:#2DBE8C} .fa{fill:#F0B429} .fm{fill:#E5587F} .fv{fill:#A07DF0} .fs{fill:#8594A8}
    .sb{stroke:#5B84FF} .sg{stroke:#2DBE8C} .sa{stroke:#F0B429} .sm{stroke:#E5587F} .sv{stroke:#A07DF0}
    .tb{fill:rgba(91,132,255,.18);stroke:#5B84FF} .tg{fill:rgba(45,190,140,.18);stroke:#2DBE8C} .ta{fill:rgba(240,180,41,.18);stroke:#F0B429}
    .tm{fill:rgba(229,88,127,.16);stroke:#E5587F} .tv{fill:rgba(160,125,240,.18);stroke:#A07DF0} .ts{fill:rgba(133,148,168,.18);stroke:#8594A8}
    .w{fill:#0F151C}
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink2"/></marker>
  <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fa"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fb"/></marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="well"/><line x1="0" y1="0" x2="0" y2="6" class="lnd" stroke-width="1" opacity=".5"/></pattern>
</defs>
<rect width="960" height="454" class="bg"/>
<text x="20" y="32" font-size="22" text-anchor="start" class="h" >A 16-line cache between the arbiter and DRAM: who wins, who loses</text><text x="20" y="52" font-size="13" text-anchor="start" class="ink2" >Same instructions, 2 SMs, DRAM latency 8. Grey: no cache. Colored: with rtl/ps_cache.v. Computed by the golden model, which the tests match to the RTL.</text><text x="20" y="98" font-size="16" text-anchor="start" class="h" >matmul</text><text x="20" y="116" font-size="12" text-anchor="start" class="ink2" >reuses rows and columns</text><rect x="200" y="84" width="148.4030296564967" height="18" rx="3" class="fs" opacity=".45"/><text x="354.4030296564967" y="98" font-size="11" text-anchor="start" class="mono ink2" >3,567 cycles</text><rect x="200" y="108" width="111.79112438660124" height="18" rx="3" class="fg" /><text x="317.79112438660127" y="122" font-size="11" text-anchor="start" class="mono" >2,687 cycles (-25%)</text><text x="780" y="98" font-size="16" text-anchor="start" class="h fg" >80% hits</text><text x="780" y="118" font-size="11.5" text-anchor="start" class="mono ink2" >DRAM trips 208 -&gt; 54</text><text x="20" y="184" font-size="16" text-anchor="start" class="h" >coalescing</text><text x="20" y="202" font-size="12" text-anchor="start" class="ink2" >a little reuse</text><rect x="200" y="170" width="11.815660337102624" height="18" rx="3" class="fs" opacity=".45"/><text x="217.81566033710263" y="184" font-size="11" text-anchor="start" class="mono ink2" >284 cycles</text><rect x="200" y="194" width="11.982078088329422" height="18" rx="3" class="fm" /><text x="217.98207808832942" y="208" font-size="11" text-anchor="start" class="mono" >288 cycles (+1%)</text><text x="780" y="184" font-size="16" text-anchor="start" class="h fg" >27% hits</text><text x="780" y="204" font-size="11.5" text-anchor="start" class="mono ink2" >DRAM trips 17 -&gt; 14</text><text x="20" y="270" font-size="16" text-anchor="start" class="h" >gradient_shader</text><text x="20" y="288" font-size="12" text-anchor="start" class="ink2" >pure streaming</text><rect x="200" y="256" width="369.9466609771709" height="18" rx="3" class="fs" opacity=".45"/><text x="575.946660977171" y="270" font-size="11" text-anchor="start" class="mono ink2" >8,892 cycles</text><rect x="200" y="280" width="390" height="18" rx="3" class="fm" /><text x="596" y="294" font-size="11" text-anchor="start" class="mono" >9,374 cycles (+5%)</text><text x="780" y="270" font-size="16" text-anchor="start" class="h ink3" >0% hits</text><text x="780" y="290" font-size="11.5" text-anchor="start" class="mono ink2" >DRAM trips 256 -&gt; 256</text><text x="20" y="356" font-size="16" text-anchor="start" class="h" >histogram</text><text x="20" y="374" font-size="12" text-anchor="start" class="ink2" >atomics bypass the cache</text><rect x="200" y="342" width="89.94879453808406" height="18" rx="3" class="fs" opacity=".45"/><text x="295.94879453808403" y="356" font-size="11" text-anchor="start" class="mono ink2" >2,162 cycles</text><rect x="200" y="366" width="103.01258800938767" height="18" rx="3" class="fm" /><text x="309.0125880093877" y="380" font-size="11" text-anchor="start" class="mono" >2,476 cycles (+15%)</text><text x="780" y="356" font-size="16" text-anchor="start" class="h ink3" >0% hits</text><text x="780" y="376" font-size="11.5" text-anchor="start" class="mono ink2" >DRAM trips 160 -&gt; 160</text><text x="20" y="436" font-size="13" text-anchor="start" class="ink2" >Reuse pays: most matmul loads never reach DRAM. Streaming loses a little: every miss now takes an extra hop through the cache.</text>
</svg>
