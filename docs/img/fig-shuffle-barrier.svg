th="80" height="34" rx="5" class="box" /><text x="382" y="379" font-size="14" text-anchor="middle" class="mono" >44</text><rect x="438" y="356" width="80" height="34" rx="5" class="box" /><text x="478" y="379" font-size="14" text-anchor="middle" class="mono" >48</text><rect x="534" y="356" width="80" height="34" rx="5" class="box" /><text x="574" y="379" font-size="14" text-anchor="middle" class="mono" >52</text><rect x="630" y="356" width="80" height="34" rx="5" class="box" /><text x="670" y="379" font-size="14" text-anchor="middle" class="mono" >56</text><rect x="726" y="356" width="80" height="34" rx="5" class="box" /><text x="766" y="379" font-size="14" text-anchor="middle" class="mono" >60</text><rect x="822" y="356" width="80" height="34" rx="5" class="box" /><text x="862" y="379" font-size="14" text-anchor="middle" class="mono" >64</text><text x="20" y="442" font-size="12.5" text-anchor="start" class="ink2" >Lane 0 ends with 36 = 1 + 2 + ... + 8 after 3 shuffles and 3 adds: no shared memory, no barrier.</text><text x="20" y="460" font-size="12.5" text-anchor="start" class="ink2" >Violet arrows: SHFL reads another lane. Grey arrows: source is out of range, so the lane keeps its own value.</text><text x="20" y="492" font-size="16" text-anchor="start" class="h" >BAR in reduction_shared: four warps arrive, one release (SM 0, cycles 316 to 348)</text><text x="20" y="523" font-size="12" text-anchor="start" class="mono ink2" >warp 0</text><rect x="150" y="511" width="237.5" height="16" rx="3" class="tg" /><rect x="387.5" y="511" width="380" height="16" rx="3" class="tm" /><text x="391.5" y="523" font-size="10.5" text-anchor="start" class="mono" >arrives 326, parked 16 cycles</text><text x="20" y="549" font-size="12" text-anchor="start" class="mono ink2" >warp 1</text><rect x="150" y="537" width="356.25" height="16" rx="3" class="tg" /><rect x="506.25" y="537" width="261.25" height="16" rx="3" class="tm" /><text x="510.25" y="549" font-size="10.5" text-anchor="start"