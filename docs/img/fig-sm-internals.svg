<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-label="Inside one Streaming Multiprocessor with RTL signal names">
<title>Inside one Streaming Multiprocessor with RTL signal names</title>
<style>
  .bg{fill:#F7F9FB} .panel{fill:#FFFFFF;stroke:#C9D1DA} .well{fill:#EEF2F6} .box{fill:#EEF2F6;stroke:#C9D1DA;stroke-width:1.2}
  .ink{fill:#182231} .ink2{fill:#4A5566} .ink3{fill:#7C8898} .ln{stroke:#C9D1DA;fill:none} .lnd{stroke:#4A5566;fill:none}
  .fb{fill:#2B57E0} .fg{fill:#13936A} .fa{fill:#D99A06} .fm{fill:#C8325F} .fv{fill:#7A4FD6} .fs{fill:#6B7A90} .fw{fill:#FFFFFF}
  .sb{stroke:#2B57E0;fill:none} .sg{stroke:#13936A;fill:none} .sa{stroke:#D99A06;fill:none} .sm{stroke:#C8325F;fill:none} .sv{stroke:#7A4FD6;fill:none}
  .tb{fill:rgba(43,87,224,.12);stroke:#2B57E0} .tg{fill:rgba(19,147,106,.16);stroke:#13936A} .ta{fill:rgba(217,154,6,.18);stroke:#D99A06}
  .tm{fill:rgba(200,50,95,.12);stroke:#C8325F} .tv{fill:rgba(122,79,214,.14);stroke:#7A4FD6} .ts{fill:rgba(107,122,144,.14);stroke:#6B7A90}
  text{font-family:'Barlow','Segoe UI',Helvetica,Arial,sans-serif;fill:#182231}
  .h{font-family:'Barlow Condensed','Arial Narrow','Segoe UI',sans-serif;font-weight:600}
  .mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
  .w{fill:#FFFFFF}
  @media (prefers-color-scheme: dark){
    .bg{fill:#16202A} .panel{fill:#0F151C;stroke:#2A3845} .well{fill:#1C2733} .box{fill:#1C2733;stroke:#2A3845}
    .ink,text{fill:#E3E9EF} .ink2{fill:#9AA8B8} .ink3{fill:#6D7C8C} .ln{stroke:#2A3845} .lnd{stroke:#9AA8B8}
    .fb{fill:#5B84FF} .fg{fill:#2DBE8C} .fa{fill:#F0B429} .fm{fill:#E5587F} .fv{fill:#A07DF0} .fs{fill:#8594A8}
    .sb{stroke:#5B84FF} .sg{stroke:#2DBE8C} .sa{stroke:#F0B429} .sm{stroke:#E5587F} .sv{stroke:#A07DF0}
    .tb{fill:rgba(91,132,255,.18);stroke:#5B84FF} .tg{fill:rgba(45,190,140,.18);stroke:#2DBE8C} .ta{fill:rgba(240,180,41,.18);stroke:#F0B429}
    .tm{fill:rgba(229,88,127,.16);stroke:#E5587F} .tv{fill:rgba(160,125,240,.18);stroke:#A07DF0} .ts{fill:rgba(133,148,168,.18);stroke:#8594A8}
    .w{fill:#0F151C}
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink2"/></marker>
  <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fa"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fb"/></marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="well"/><line x1="0" y1="0" x2="0" y2="6" class="lnd" stroke-width="1" opacity=".5"/></pattern>
</defs>
<rect width="960" height="590" class="bg"/>
<text x="20" y="32" font-size="22" text-anchor="start" class="h" >Inside one SM: blocks and the RTL signals that connect them (rtl/ps_sm.v)</text><rect x="20" y="60" width="180" height="250" rx="6" class="tb" /><text x="30" y="80" font-size="16" text-anchor="start" class="h" >Warp scheduler</text><text x="30" y="100" font-size="12.5" text-anchor="start" class="ink2" >per warp: valid, wait, done</text><text x="30" y="117" font-size="12.5" text-anchor="start" class="mono ink2" >w_minpc = min PC of</text><text x="30" y="134" font-size="12.5" text-anchor="start" class="mono ink2" >live lanes</text><text x="30" y="151" font-size="12.5" text-anchor="start" class="mono ink2" >pick = next ready warp</text><text x="30" y="168" font-size="12.5" text-anchor="start" class="mono ink2" >(round robin rr_ptr)</text><text x="30" y="185" font-size="12.5" text-anchor="start" class="mono ink2" >pick_act = lanes at</text><text x="30" y="202" font-size="12.5" text-anchor="start" class="mono ink2" >the min PC</text><line x1="200" y1="110" x2="238" y2="110" class="sb" stroke-width="1.8" marker-end="url(#ahb)" /><text x="204" y="102" font-size="11.5" text-anchor="start" class="mono fb" >cpc</text><rect x="240" y="60" width="150" height="90" rx="6" class="box" /><text x="250" y="80" font-size="16" text-anchor="start" class="h" >Fetch</text><text x="250" y="100" font-size="12.5" text-anchor="start" class="ink2" >ir &lt;= imem[cpc]</text><text x="250" y="117" font-size="12.5" text-anchor="start" class="mono ink2" >1 cycle</text><line x1="390" y1="110" x2="428" y2="110" class="sb" stroke-width="1.8" marker-end="url(#ahb)" /><text x="396" y="102" font-size="11.5" text-anchor="start" class="mono fb" >ir</text><rect x="430" y="60" width="170" height="90" rx="6" class="box" /><text x="440" y="80" font-size="16" text-anchor="start" class="h" >Decode</text><text x="440" y="100" font-size="12.5" text-anchor="start" class="ink2" >ps_decoder.v</text><text x="440" y="117" font-size="12.5" text-anchor="start" class="mono ink2" >guard per lane:</text><text x="440" y="134" font-size="12.5" text-anchor="start" class="mono ink2" >cexe = cact &amp; guard_ok</text><line x1="515" y1="150" x2="515" y2="186" class="sb" stroke-width="1.8" marker-end="url(#ahb)" /><text x="508" y="174" font-size="11.5" text-anchor="end" class="mono fb" >d_rs1, d_rs2, d_rs3</text><rect x="240" y="190" width="360" height="120" rx="6" class="box" /><text x="250" y="210" font-size="16" text-anchor="start" class="h" >Register file</text><text x="250" y="230" font-size="12.5" text-anchor="start" class="ink2" >rf[thread * 16 + reg], 32 threads x 16 x 32 bit</text><text x="250" y="247" font-size="12.5" text-anchor="start" class="mono ink2" >preds: 4 bits per thread</text><text x="250" y="264" font-size="12.5" text-anchor="start" class="mono ink2" >lpc: one PC per thread     ldone: exited flag</text><line x1="600" y1="250" x2="638" y2="250" class="sb" stroke-width="1.8" marker-end="url(#ahb)" /><text x="602" y="242" font-size="11.5" text-anchor="start" class="mono fb" >a, b, c</text><rect x="640" y="60" width="300" height="250" rx="8" class="tg" /><text x="652" y="82" font-size="16" text-anchor="start" class="h" >Execution lanes</text><rect x="652" y="96" width="62" height="54" rx="5" class="w" stroke="#13936A"/><text x="660" y="114" font-size="11" text-anchor="start" class="mono ink2" >lane 0</text><text x="660" y="134" font-size="12" text-anchor="start" class="mono" >ps_alu</text><rect x="722" y="96" width="62" height="54" rx="5" class="w" stroke="#13936A"/><text x="730" y="114" font-size="11" text-anchor="start" class="mono ink2" >lane 1</text><text x="730" y="134" font-size="12" text-anchor="start" class="mono" >ps_alu</text><rect x="792" y="96" width="62" height="54" rx="5" class="w" stroke="#13936A"/><text x="800" y="114" font-size="11" text-anchor="start" class="mono ink2" >lane 2</text><text x="800" y="134" font-size="12" text-anchor="start" class="mono" >ps_alu</text><rect x="862" y="96" width="62" height="54" rx="5" class="w" stroke="#13936A"/><text x="870" y="114" font-size="11" text-anchor="start" class="mono ink2" >lane 3</text><text x="870" y="134" font-size="12" text-anchor="start" class="mono" >ps_alu</text><rect x="652" y="158" width="62" height="54" rx="5" class="w" stroke="#13936A"/><text x="660" y="176" font-size="11" text-anchor="start" class="mono ink2" >lane 4</text><text x="660" y="196" font-size="12" text-anchor="start" class="mono" >ps_alu</text><rect x="722" y="158" width="62" height="54" rx="5" class="w" stroke="#13936A"/><text x="730" y="176" font-size="11" text-anchor="start" class="mono ink2" >lane 5</text><text x="730" y="196" font-size="12" text-anchor="start" class="mono" >ps_alu</text><rect x="792" y="158" width="62" height="54" rx="5" class="w" stroke="#13936A"/><text x="800" y="176" font-size="11" text-anchor="start" class="mono ink2" >lane 6</text><text x="800" y="196" font-size="12" text-anchor="start" class="mono" >ps_alu</text><rect x="862" y="158" width="62" height="54" rx="5" class="w" stroke="#13936A"/><text x="870" y="176" font-size="11" text-anchor="start" class="mono ink2" >lane 7</text><text x="870" y="196" font-size="12" text-anchor="start" class="mono" >ps_alu</text><rect x="652" y="226" width="134" height="72" rx="5" class="tv" /><text x="660" y="246" font-size="14" text-anchor="start" class="h" >SHFL crossbar</text><text x="660" y="264" font-size="11.5" text-anchor="start" class="ink2" >reads a_flat of</text><text x="660" y="280" font-size="11.5" text-anchor="start" class="ink2" >every lane</text><rect x="794" y="226" width="134" height="72" rx="5" class="tv" /><text x="802" y="246" font-size="14" text-anchor="start" class="h" >VOTE tree</text><text x="802" y="264" font-size="11.5" text-anchor="start" class="ink2" >ballot = vote_bit</text><text x="802" y="280" font-size="11.5" text-anchor="start" class="ink2" >&amp; cexe</text><line x1="790" y1="310" x2="790" y2="350" class="sg" stroke-width="1.8" marker-end="url(#ah)" /><text x="782" y="338" font-size="11.5" text-anchor="end" class="mono fb" >r_res, r_addr, r_data, r_npc</text><rect x="20" y="360" width="420" height="150" rx="6" class="ta" /><text x="30" y="380" font-size="16" text-anchor="start" class="h" >Load/store unit</text><text x="30" y="400" font-size="12.5" text-anchor="start" class="ink2" >leader = lowest lane in lpend</text><text x="30" y="417" font-size="12.5" text-anchor="start" class="mono ink2" >global: g_serve = lanes in the leader's 4-word line</text><text x="30" y="434" font-size="12.5" text-anchor="start" class="mono ink2" >        -&gt; one mreq_valid transaction, wait mresp_valid</text><text x="30" y="451" font-size="12.5" text-anchor="start" class="mono ink2" >shared: s_sel = one lane per bank (same word = broadcast)</text><text x="30" y="468" font-size="12.5" text-anchor="start" class="mono ink2" >        -&gt; one pass per cycle, conflicts wait</text><rect x="470" y="360" width="220" height="150" rx="6" class="ta" /><text x="480" y="380" font-size="16" text-anchor="start" class="h" >Shared memory</text><text x="480" y="400" font-size="12.5" text-anchor="start" class="ink2" >smem[256]</text><text x="480" y="417" font-size="12.5" text-anchor="start" class="mono ink2" >bank = address mod 8</text><rect x="482" y="440" width="21" height="56" rx="3" class="w" stroke="#D99A06"/><text x="492" y="472" font-size="11" text-anchor="middle" class="mono ink2" >0</text><rect x="507" y="440" width="21" height="56" rx="3" class="w" stroke="#D99A06"/><text x="517" y="472" font-size="11" text-anchor="middle" class="mono ink2" >1</text><rect x="532" y="440" width="21" height="56" rx="3" class="w" stroke="#D99A06"/><text x="542" y="472" font-size="11" text-anchor="middle" class="mono ink2" >2</text><rect x="557" y="440" width="21" height="56" rx="3" class="w" stroke="#D99A06"/><text x="567" y="472" font-size="11" text-anchor="middle" class="mono ink2" >3</text><rect x="582" y="440" width="21" height="56" rx="3" class="w" stroke="#D99A06"/><text x="592" y="472" font-size="11" text-anchor="middle" class="mono ink2" >4</text><rect x="607" y="440" width="21" height="56" rx="3" class="w" stroke="#D99A06"/><text x="617" y="472" font-size="11" text-anchor="middle" class="mono ink2" >5</text><rect x="632" y="440" width="21" height="56" rx="3" class="w" stroke="#D99A06"/><text x="642" y="472" font-size="11" text-anchor="middle" class="mono ink2" >6</text><rect x="657" y="440" width="21" height="56" rx="3" class="w" stroke="#D99A06"/><text x="667" y="472" font-size="11" text-anchor="middle" class="mono ink2" >7</text><line x1="440" y1="435" x2="468" y2="435" class="sa" stroke-width="1.8" marker-end="url(#aha)" /><rect x="720" y="360" width="220" height="150" rx="6" class="tb" /><text x="730" y="380" font-size="16" text-anchor="start" class="h" >Writeback</text><text x="730" y="400" font-size="12.5" text-anchor="start" class="ink2" >rf[..][d_rd] &lt;= r_res</text><text x="730" y="417" font-size="12.5" text-anchor="start" class="mono ink2" >preds, lpc, ldone</text><text x="730" y="434" font-size="12.5" text-anchor="start" class="mono ink2" >w_wait on BAR</text><text x="730" y="451" font-size="12.5" text-anchor="start" class="mono ink2" >rr_ptr &lt;= cw + 1</text><line x1="790" y1="350" x2="790" y2="356" class="sg" stroke-width="1.8" marker-end="url(#ah)" /><path d="M830,360 L830,330 L960,330" class="sb" stroke-width="1.4" fill="none"  opacity=".0"/><line x1="230" y1="510" x2="230" y2="540" class="sa" stroke-width="2" marker-end="url(#aha)" /><text x="240" y="534" font-size="12" text-anchor="start" class="mono ink2" >to ps_mem_arbiter: mreq_op / mreq_addr / mreq_wmask / mreq_wdata</text><path d="M940,435 L950,435 L950,330 L10,330 L10,185 L18,185" class="sb" stroke-width="1.4" fill="none" marker-end="url(#ahb)" stroke-dasharray="5 4"/><text x="18" y="572" font-size="13" text-anchor="start" class="ink2" >The dashed blue path closes the loop: after writeback the scheduler sees the new per-lane PCs and picks the next warp.</text>
</svg>
