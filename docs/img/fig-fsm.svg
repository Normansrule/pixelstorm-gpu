<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="SM control FSM and cycle costs">
<title>SM control FSM and cycle costs</title>
<style>
  .bg{fill:#F7F9FB} .panel{fill:#FFFFFF;stroke:#C9D1DA} .well{fill:#EEF2F6} .box{fill:#EEF2F6;stroke:#C9D1DA;stroke-width:1.2}
  .ink{fill:#182231} .ink2{fill:#4A5566} .ink3{fill:#7C8898} .ln{stroke:#C9D1DA;fill:none} .lnd{stroke:#4A5566;fill:none}
  .fb{fill:#2B57E0} .fg{fill:#13936A} .fa{fill:#D99A06} .fm{fill:#C8325F} .fv{fill:#7A4FD6} .fs{fill:#6B7A90} .fw{fill:#FFFFFF}
  .sb{stroke:#2B57E0;fill:none} .sg{stroke:#13936A;fill:none} .sa{stroke:#D99A06;fill:none} .sm{stroke:#C8325F;fill:none} .sv{stroke:#7A4FD6;fill:none}
  .tb{fill:rgba(43,87,224,.12);stroke:#2B57E0} .tg{fill:rgba(19,147,106,.16);stroke:#13936A} .ta{fill:rgba(217,154,6,.18);stroke:#D99A06}
  .tm{fill:rgba(200,50,95,.12);stroke:#C8325F} .tv{fill:rgba(122,79,214,.14);stroke:#7A4FD6} .ts{fill:rgba(107,122,144,.14);stroke:#6B7A90}
  text{font-family:'Barlow','Segoe UI',Helvetica,Arial,sans-serif;fill:#182231}
  .h{font-family:'Barlow Condensed','Arial Narrow','Segoe UI',sans-serif;font-weight:600}
  .mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
  .w{fill:#FFFFFF}
  @media (prefers-color-scheme: dark){
    .bg{fill:#16202A} .panel{fill:#0F151C;stroke:#2A3845} .well{fill:#1C2733} .box{fill:#1C2733;stroke:#2A3845}
    .ink,text{fill:#E3E9EF} .ink2{fill:#9AA8B8} .ink3{fill:#6D7C8C} .ln{stroke:#2A3845} .lnd{stroke:#9AA8B8}
    .fb{fill:#5B84FF} .fg{fill:#2DBE8C} .fa{fill:#F0B429} .fm{fill:#E5587F} .fv{fill:#A07DF0} .fs{fill:#8594A8}
    .sb{stroke:#5B84FF} .sg{stroke:#2DBE8C} .sa{stroke:#F0B429} .sm{stroke:#E5587F} .sv{stroke:#A07DF0}
    .tb{fill:rgba(91,132,255,.18);stroke:#5B84FF} .tg{fill:rgba(45,190,140,.18);stroke:#2DBE8C} .ta{fill:rgba(240,180,41,.18);stroke:#F0B429}
    .tm{fill:rgba(229,88,127,.16);stroke:#E5587F} .tv{fill:rgba(160,125,240,.18);stroke:#A07DF0} .ts{fill:rgba(133,148,168,.18);stroke:#8594A8}
    .w{fill:#0F151C}
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink2"/></marker>
  <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fa"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fb"/></marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="well"/><line x1="0" y1="0" x2="0" y2="6" class="lnd" stroke-width="1" opacity=".5"/></pattern>
</defs>
<rect width="1000" height="520" class="bg"/>
<text x="20" y="32" font-size="22" text-anchor="start" class="h" >The SM control Finite State Machine (FSM): one instruction at a time</text><g transform="translate(0,50)"><circle cx="80" cy="150" r="46" class="box" stroke-width="2"/><text x="80" y="148" font-size="17" text-anchor="middle" class="h" >IDLE</text><text x="80" y="167" font-size="11.5" text-anchor="middle" class="ink2" >no block</text><circle cx="230" cy="150" r="46" class="tb" stroke-width="2"/><text x="230" y="148" font-size="17" text-anchor="middle" class="h" >SCHED</text><text x="230" y="167" font-size="11.5" text-anchor="middle" class="ink2" >pick warp</text><circle cx="380" cy="150" r="46" class="tb" stroke-width="2"/><text x="380" y="148" font-size="17" text-anchor="middle" class="h" >FETCH</text><text x="380" y="167" font-size="11.5" text-anchor="middle" class="ink2" >ir &lt;= imem</text><circle cx="530" cy="150" r="46" class="tb" stroke-width="2"/><text x="530" y="148" font-size="17" text-anchor="middle" class="h" >DECODE</text><text x="530" y="167" font-size="11.5" text-anchor="middle" class="ink2" >guard mask</text><circle cx="680" cy="150" r="46" class="tg" stroke-width="2"/><text x="680" y="148" font-size="17" text-anchor="middle" class="h" >EXEC</text><text x="680" y="167" font-size="11.5" text-anchor="middle" class="ink2" >8 ALUs</text><circle cx="830" cy="240" r="46" class="ta" stroke-width="2"/><text x="830" y="238" font-size="17" text-anchor="middle" class="h" >MEM</text><text x="830" y="257" font-size="11.5" text-anchor="middle" class="ink2" >n cycles</text><circle cx="830" cy="90" r="46" class="tb" stroke-width="2"/><text x="830" y="88" font-size="17" text-anchor="middle" class="h" >WB</text><text x="830" y="107" font-size="11.5" text-anchor="middle" class="ink2" >write regs</text><line x1="128" y1="150" x2="180" y2="150" class="lnd" stroke-width="1.8" marker-end="url(#ah)" /><text x="155" y="142" font-size="11.5" text-anchor="middle" class="ink2" >blk_start</text><line x1="278" y1="150" x2="330" y2="150" class="lnd" stroke-width="1.8" marker-end="url(#ah)" /><text x="305" y="142" font-size="11.5" text-anchor="middle" class="ink2" >found</text><line x1="428" y1="150" x2="480" y2="150" class="lnd" stroke-width="1.8" marker-end="url(#ah)" /><line x1="578" y1="150" x2="630" y2="150" class="lnd" stroke-width="1.8" marker-end="url(#ah)" /><line x1="721.1596604342021" y1="174.69579626052126" x2="787.1253537143727" y2="214.27521222862367" class="sa" stroke-width="1.8" marker-end="url(#ah)" /><text x="755" y="187" font-size="11.5" text-anchor="middle" class="ink2" >load/store</text><line x1="724.5668811624925" y1="132.17324753500301" x2="783.576165455737" y2="108.56953381770518" class="lnd" stroke-width="1.8" marker-end="url(#ah)" /><text x="755" y="112" font-size="11.5" text-anchor="middle" class="ink2" >ALU op</text><line x1="830" y1="192" x2="830" y2="140" class="sa" stroke-width="1.8" marker-end="url(#ah)" /><text x="830" y="157" font-size="11.5" text-anchor="middle" class="ink2" >no lanes pending</text><path d="M830,44 C830,10 230,10 230,104" class="sb" stroke-width="1.8" fill="none" marker-end="url(#ahb)" /><text x="530" y="22" font-size="12" text-anchor="middle" class="ink2" >back to SCHED: rr_ptr moves to the next warp</text><path d="M876,240 C930,210 930,275 876,258" class="sa" stroke-width="1.6" fill="none" marker-end="url(#aha)" /><text x="935" y="246" font-size="11" text-anchor="start" class="ink2" >next txn</text><path d="M200,190 C180,250 280,250 258,190" class="sm" stroke-width="1.6" fill="none" marker-end="url(#ah)" /><text x="230" y="262" font-size="11.5" text-anchor="middle" class="ink2" >barrier release</text><path d="M200,120 C150,70 110,90 104,110" class="lnd" stroke-width="1.4" fill="none" marker-end="url(#ah)" /><text x="150" y="78" font-size="11.5" text-anchor="middle" class="ink2" >block done</text></g><text x="20" y="370" font-size="17" text-anchor="start" class="h" >Cycle cost per instruction class</text><text x="20" y="404" font-size="12.5" text-anchor="start" class="ink2" >ALU (ADD, MAD, SETP ...)</text><rect x="260" y="386" width="40" height="26" rx="3" class="tb" /><text x="280" y="403" font-size="13" text-anchor="middle" class="h" >S</text><rect x="302" y="386" width="40" height="26" rx="3" class="tb" /><text x="322" y="403" font-size="13" text-anchor="middle" class="h" >F</text><rect x="344" y="386" width="40" height="26" rx="3" class="tb" /><text x="364" y="403" font-size="13" text-anchor="middle" class="h" >D</text><rect x="386" y="386" width="40" height="26" rx="3" class="tg" /><text x="406" y="403" font-size="13" text-anchor="middle" class="h" >E</text><rect x="428" y="386" width="40" height="26" rx="3" class="tb" /><text x="448" y="403" font-size="13" text-anchor="middle" class="h" >W</text><text x="478" y="404" font-size="12.5" text-anchor="start" class="mono" >5 cycles</text><text x="20" y="438" font-size="12.5" text-anchor="start" class="ink2" >Shared load, no conflict</text><rect x="260" y="420" width="40" height="26" rx="3" class="tb" /><text x="280" y="437" font-size="13" text-anchor="middle" class="h" >S</text><rect x="302" y="420" width="40" height="26" rx="3" class="tb" /><text x="322" y="437" font-size="13" text-anchor="middle" class="h" >F</text><rect x="344" y="420" width="40" height="26" rx="3" class="tb" /><text x="364" y="437" font-size="13" text-anchor="middle" class="h" >D</text><rect x="386" y="420" width="40" height="26" rx="3" class="tg" /><text x="406" y="437" font-size="13" text-anchor="middle" class="h" >E</text><rect x="428" y="420" width="40" height="26" rx="3" class="ta" /><text x="448" y="437" font-size="13" text-anchor="middle" class="h" >M</text><rect x="470" y="420" width="40" height="26" rx="3" class="ta" /><text x="490" y="437" font-size="13" text-anchor="middle" class="h" >M</text><rect x="512" y="420" width="40" height="26" rx="3" class="tb" /><text x="532" y="437" font-size="13" text-anchor="middle" class="h" >W</text><text x="562" y="438" font-size="12.5" text-anchor="start" class="mono" >7 cycles</text><text x="20" y="472" font-size="12.5" text-anchor="start" class="ink2" >Global load, 2 transactions, 1 SM</text><rect x="260" y="454" width="40" height="26" rx="3" class="tb" /><text x="280" y="471" font-size="13" text-anchor="middle" class="h" >S</text><rect x="302" y="454" width="40" height="26" rx="3" class="tb" /><text x="322" y="471" font-size="13" text-anchor="middle" class="h" >F</text><rect x="344" y="454" width="40" height="26" rx="3" class="tb" /><text x="364" y="471" font-size="13" text-anchor="middle" class="h" >D</text><rect x="386" y="454" width="40" height="26" rx="3" class="tg" /><text x="406" y="471" font-size="13" text-anchor="middle" class="h" >E</text><rect x="428" y="454" width="400" height="26" rx="3" class="ta" /><text x="628" y="471" font-size="13" text-anchor="middle" class="h" >MEM x 25 cycles</text><rect x="830" y="454" width="40" height="26" rx="3" class="tb" /><text x="850" y="471" font-size="13" text-anchor="middle" class="h" >W</text><text x="880" y="472" font-size="12.5" text-anchor="start" class="mono" >30 cycles</text><text x="20" y="506" font-size="12.5" text-anchor="start" class="ink3" >A pipelined SM overlaps these boxes and issues every cycle (docs/12-make-it-better.md, exercise 1).</text>
</svg>
