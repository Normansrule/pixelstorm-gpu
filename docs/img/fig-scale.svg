<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" role="img" aria-label="Scale comparison between Pixelstorm and NVIDIA H100">
<title>Scale comparison between Pixelstorm and NVIDIA H100</title>
<style>
  .bg{fill:#F7F9FB} .panel{fill:#FFFFFF;stroke:#C9D1DA} .well{fill:#EEF2F6} .box{fill:#EEF2F6;stroke:#C9D1DA;stroke-width:1.2}
  .ink{fill:#182231} .ink2{fill:#4A5566} .ink3{fill:#7C8898} .ln{stroke:#C9D1DA;fill:none} .lnd{stroke:#4A5566;fill:none}
  .fb{fill:#2B57E0} .fg{fill:#13936A} .fa{fill:#D99A06} .fm{fill:#C8325F} .fv{fill:#7A4FD6} .fs{fill:#6B7A90} .fw{fill:#FFFFFF}
  .sb{stroke:#2B57E0;fill:none} .sg{stroke:#13936A;fill:none} .sa{stroke:#D99A06;fill:none} .sm{stroke:#C8325F;fill:none} .sv{stroke:#7A4FD6;fill:none}
  .tb{fill:rgba(43,87,224,.12);stroke:#2B57E0} .tg{fill:rgba(19,147,106,.16);stroke:#13936A} .ta{fill:rgba(217,154,6,.18);stroke:#D99A06}
  .tm{fill:rgba(200,50,95,.12);stroke:#C8325F} .tv{fill:rgba(122,79,214,.14);stroke:#7A4FD6} .ts{fill:rgba(107,122,144,.14);stroke:#6B7A90}
  text{font-family:'Barlow','Segoe UI',Helvetica,Arial,sans-serif;fill:#182231}
  .h{font-family:'Barlow Condensed','Arial Narrow','Segoe UI',sans-serif;font-weight:600}
  .mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
  .w{fill:#FFFFFF}
  @media (prefers-color-scheme: dark){
    .bg{fill:#16202A} .panel{fill:#0F151C;stroke:#2A3845} .well{fill:#1C2733} .box{fill:#1C2733;stroke:#2A3845}
    .ink,text{fill:#E3E9EF} .ink2{fill:#9AA8B8} .ink3{fill:#6D7C8C} .ln{stroke:#2A3845} .lnd{stroke:#9AA8B8}
    .fb{fill:#5B84FF} .fg{fill:#2DBE8C} .fa{fill:#F0B429} .fm{fill:#E5587F} .fv{fill:#A07DF0} .fs{fill:#8594A8}
    .sb{stroke:#5B84FF} .sg{stroke:#2DBE8C} .sa{stroke:#F0B429} .sm{stroke:#E5587F} .sv{stroke:#A07DF0}
    .tb{fill:rgba(91,132,255,.18);stroke:#5B84FF} .tg{fill:rgba(45,190,140,.18);stroke:#2DBE8C} .ta{fill:rgba(240,180,41,.18);stroke:#F0B429}
    .tm{fill:rgba(229,88,127,.16);stroke:#E5587F} .tv{fill:rgba(160,125,240,.18);stroke:#A07DF0} .ts{fill:rgba(133,148,168,.18);stroke:#8594A8}
    .w{fill:#0F151C}
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink2"/></marker>
  <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fa"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fb"/></marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="well"/><line x1="0" y1="0" x2="0" y2="6" class="lnd" stroke-width="1" opacity=".5"/></pattern>
</defs>
<rect width="960" height="564" class="bg"/>
<text x="20" y="32" font-size="22" text-anchor="start" class="h" >Pixelstorm next to an NVIDIA H100 (SXM5): same ideas, different scale</text><text x="20" y="52" font-size="13" text-anchor="start" class="ink2" >Logarithmic bars. H100 figures from NVIDIA's H100 Tensor Core GPU architecture whitepaper.</text><text x="20" y="102" font-size="15" text-anchor="start" class="h" >Streaming Multiprocessors</text><rect x="260" y="84" width="75.81343651628704" height="16" rx="3" class="fg" /><text x="341.813436516287" y="97" font-size="11.5" text-anchor="start" class="mono ink2" >Pixelstorm 2</text><rect x="260" y="104" width="181.84164424826776" height="16" rx="3" class="fb" /><text x="447.84164424826776" y="117" font-size="11.5" text-anchor="start" class="mono ink2" >H100 132</text><text x="20" y="152" font-size="15" text-anchor="start" class="h" >Threads per warp</text><rect x="260" y="134" width="110.89659146556569" height="16" rx="3" class="fg" /><text x="376.8965914655657" y="147" font-size="11.5" text-anchor="start" class="mono ink2" >Pixelstorm 8</text><rect x="260" y="154" width="145.97974641484439" height="16" rx="3" class="fb" /><text x="411.9797464148444" y="167" font-size="11.5" text-anchor="start" class="mono ink2" >H100 32</text><text x="20" y="202" font-size="15" text-anchor="start" class="h" >Resident warps per SM</text><rect x="260" y="184" width="93.35501399092637" height="16" rx="3" class="fg" /><text x="359.35501399092635" y="197" font-size="11.5" text-anchor="start" class="mono ink2" >Pixelstorm 4</text><rect x="260" y="204" width="163.52132388948368" height="16" rx="3" class="fb" /><text x="429.5213238894837" y="217" font-size="11.5" text-anchor="start" class="mono ink2" >H100 64</text><text x="20" y="252" font-size="15" text-anchor="start" class="h" >Resident threads per GPU</text><rect x="260" y="234" width="163.52132388948368" height="16" rx="3" class="fg" /><text x="429.5213238894837" y="247" font-size="11.5" text-anchor="start" class="mono ink2" >Pixelstorm 64</text><rect x="260" y="254" width="374.7989964693004" height="16" rx="3" class="fb" /><text x="640.7989964693004" y="267" font-size="11.5" text-anchor="start" class="mono ink2" >H100 270,336</text><text x="20" y="302" font-size="15" text-anchor="start" class="h" >Register file per SM</text><rect x="260" y="284" width="75.81343651628704" height="16" rx="3" class="fg" /><text x="341.813436516287" y="297" font-size="11.5" text-anchor="start" class="mono ink2" >Pixelstorm 2 KB</text><rect x="260" y="304" width="198.60447883876233" height="16" rx="3" class="fb" /><text x="464.60447883876236" y="317" font-size="11.5" text-anchor="start" class="mono ink2" >H100 256 KB</text><text x="20" y="352" font-size="15" text-anchor="start" class="h" >Shared memory per SM</text><rect x="260" y="334" width="58.2718590416477" height="16" rx="3" class="fg" /><text x="324.2718590416477" y="347" font-size="11.5" text-anchor="start" class="mono ink2" >Pixelstorm 1 KB</text><rect x="260" y="354" width="195.6731060754473" height="16" rx="3" class="fb" /><text x="461.6731060754473" y="367" font-size="11.5" text-anchor="start" class="mono ink2" >H100 228 KB</text><text x="20" y="402" font-size="15" text-anchor="start" class="h" >Shared-memory banks</text><rect x="260" y="384" width="110.89659146556569" height="16" rx="3" class="fg" /><text x="376.8965914655657" y="397" font-size="11.5" text-anchor="start" class="mono ink2" >Pixelstorm 8</text><rect x="260" y="404" width="145.97974641484439" height="16" rx="3" class="fb" /><text x="411.9797464148444" y="417" font-size="11.5" text-anchor="start" class="mono ink2" >H100 32</text><text x="20" y="452" font-size="15" text-anchor="start" class="h" >Last-level cache</text><rect x="260" y="434" width="2" height="16" rx="3" class="fg" /><text x="268" y="447" font-size="11.5" text-anchor="start" class="mono ink2" >Pixelstorm none</text><rect x="260" y="454" width="332.68977439669703" height="16" rx="3" class="fb" /><text x="598.689774396697" y="467" font-size="11.5" text-anchor="start" class="mono ink2" >H100 50 MB</text><text x="20" y="502" font-size="15" text-anchor="start" class="h" >DRAM capacity</text><rect x="260" y="484" width="198.60447883876233" height="16" rx="3" class="fg" /><text x="464.60447883876236" y="497" font-size="11.5" text-anchor="start" class="mono ink2" >Pixelstorm 256 KB</text><rect x="260" y="504" width="520" height="16" rx="3" class="fb" /><text x="786" y="517" font-size="11.5" text-anchor="start" class="mono ink2" >H100 80 GB</text><text x="20" y="544" font-size="13" text-anchor="start" class="ink2" >Every Pixelstorm size is a Verilog parameter: raise NUM_SMS, WARP_SIZE, NUM_WARPS and rerun make test.</text>
</svg>
