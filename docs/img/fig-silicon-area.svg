 width="38.02456348031962" height="14" rx="2" class="fs" /><text x="774.0245634803197" y="359" font-size="11" text-anchor="start" class="mono ink3" >3,671</text><text x="20" y="392" font-size="12.5" text-anchor="start" class="ink2" >145,800 cells (10,592 flip-flops) plus 145,607 tap/decap/filler cells on a 1670.2 x 1455.52 um die (2.431 mm²).</text>
</svg>
