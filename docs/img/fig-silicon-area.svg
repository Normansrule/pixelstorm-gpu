<rect width="960" height="408" class="bg"/>
<text x="20" y="32" font-size="22" text-anchor="start" class="h" >Where the 1.19 mm² of logic goes (SkyWater 130 nm, ps_s130 configuration)</text><text x="20" y="52" font-size="13" text-anchor="start" class="ink2" >Standard-cell area by block, from Yosys + the placer. Arithmetic lanes and storage dominate, as on every GPU.</text><text x="20" y="92" font-size="13.5" text-anchor="start" class="ink" >ALU lanes (8)</text><rect x="230" y="78" width="250" height="20" rx="3" class="fg" /><text x="486" y="93" font-size="11.5" text-anchor="start" class="mono ink2" >0.492 mm²  41.2%</text><text x="20" y="122" font-size="13.5" text-anchor="start" class="ink" >register files</text><rect x="230" y="108" width="122.04167098243026" height="20" rx="3" class="fv" /><text x="358.0416709824303" y="123" font-size="11.5" text-anchor="start" class="mono ink2" >0.240 mm²  20.1%</text><text x="20" y="152" font-size="13.5" text-anchor="start" class="ink" >schedulers, LSUs, control</text><rect x="230" y="138" width="101.54077838096921" height="20" rx="3" class="fb" /><text x="337.5407783809692" y="153" font-size="11.5" text-anchor="start" class="mono ink2" >0.200 mm²  16.7%</text><text x="20" y="182" font-size="13.5" text-anchor="start" class="ink" >shared memory</text><rect x="230" y="168" width="66.86336393971335" height="20" rx="3" class="fa" /><text x="302.86336393971334" y="183" font-size="11.5" text-anchor="start" class="mono ink2" >0.132 mm²  11.0%</text><text x="20" y="212" font-size="13.5" text-anchor="start" class="ink" >instruction memory</text><rect x="230" y="198" width="48.348230333826855" height="20" rx="3" class="fb" /><text x="284.34823033382685" y="213" font-size="11.5" text-anchor="start" class="mono ink2" >0.095 mm²  8.0%</text><text x="20" y="242" font-size="13.5" text-anchor="start" class="ink" >constant bank</text><rect x="230" y="228" width="11.86022612570347" height="20" rx="3" class="fb" /><text x="247.86022612570346" y="243" font-size="11.5" text-anchor="start" class="mono ink2" >0.023 mm²  2.0%</text><text x="20" y="272" font-size="13.5" text-anchor="start" class="ink" >memory arbiter</text><rect x="230" y="258" width="3.881648560768998" height="20" rx="3" class="fm" /><text x="239.881648560769" y="273" font-size="11.5" text-anchor="start" class="mono ink2" >0.008 mm²  0.6%</text><text x="20" y="302" font-size="13.5" text-anchor="start" class="ink" >dispatcher</text><rect x="230" y="288" width="1.2723886583763386" height="20" rx="3" class="fb" /><text x="237.27238865837634" y="303" font-size="11.5" text-anchor="start" class="mono ink2" >0.003 mm²  0.2%</text><text x="20" y="332" font-size="13.5" text-anchor="start" class="ink" >top level</text><rect x="230" y="318" width="0.736726234359165" height="20" rx="3" class="fs" /><text x="236.73672623435917" y="333" font-size="11.5" text-anchor="start" class="mono ink2" >0.001 mm²  0.1%</text><text x="730" y="72" font-size="16" text-anchor="start" class="h" >Most used cells</text><text x="720" y="117" font-size="11.5" text-anchor="end" class="mono" >nand2_1</text><rect x="730" y="106" width="210" height="14" rx="2" class="fs" /><text x="946" y="117" font-size="11" text-anchor="start" class="mono ink3" >20,274</text><text x="720" y="139" font-size="11.5" text-anchor="end" class="mono" >a21oi_1</text><rect x="730" y="128" width="158.21988754069253" height="14" rx="2" class="fs" /><text x="894.2198875406925" y="139" font-size="11" text-anchor="start" class="mono ink3" >15,275</text><text x="720" y="161" font-size="11.5" text-anchor="end" class="mono" >nor2_1</text><rect x="730" y="150" width="156.22077537733057" height="14" rx="2" class="fs" /><text x="892.2207753773306" y="161" font-size="11" text-anchor="start" class="mono ink3" >15,082</text><text x="720" y="183" font-size="11.5" text-anchor="end" class="mono" >o21ai_0</text><rect x="730" y="172" width="126.08907960935188" height="14" rx="2" class="fs" /><text x="862.0890796093519" y="183" font-size="11" text-anchor="start" class="m