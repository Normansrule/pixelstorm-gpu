<rect width="960" height="330" class="bg"/>
<text x="20" y="32" font-size="22" text-anchor="start" class="h" >From Verilog to silicon: the steps, and which ones Pixelstorm runs today</text><text x="20" y="52" font-size="13" text-anchor="start" class="ink2" >Solid: done by make silicon. Dashed: the rest of a real flow (OpenROAD / OpenLane). Violet: what a foundry and packaging house do.</text><rect x="20" y="80" width="140" height="80" rx="8" class="tb" stroke-width="1.6"/><text x="32" y="108" font-size="17" text-anchor="start" class="h" >Verilog RTL</text><text x="32" y="130" font-size="12" text-anchor="start" class="ink2" >rtl/*.v</text><text x="32" y="148" font-size="12" text-anchor="start" class="h fg" >Pixelstorm: yes</text><line x1="162" y1="120" x2="174" y2="120" class="lnd" stroke-width="1.6" marker-end="url(#ah)" /><rect x="176" y="80" width="140" height="80" rx="8" class="tg" stroke-width="1.6"/><text x="188" y="108" font-size="17" text-anchor="start" class="h" >Synthesis</text><text x="188" y="130" font-size="12" text-anchor="start" class="ink2" >Yosys + sky130 Liberty</text><text x="188" y="148" font-size="12" text-anchor="start" class="h fg" >Pixelstorm: yes</text><line x1="318" y1="120" x2="330" y2="120" class="lnd" stroke-width="1.6" marker-end="url(#ah)" /><rect x="332" y="80" width="140" height="80" rx="8" class="tg" stroke-width="1.6"/><text x="344" y="108" font-size="17" text-anchor="start" class="h" >Gate netlist</text><text x="344" y="130" font-size="12" text-anchor="start" class="ink2" >145,800 cells</text><text x="344" y="148" font-size="12" text-anchor="start" class="h fg" >Pixelstorm: yes</text><line x1="474" y1="120" x2="486" y2="120" class="lnd" stroke-width="1.6" marker-end="url(#ah)" /><rect x="488" y="80" width="140" height="80" rx="8" class="ta" stroke-width="1.6"/><text x="500" y="108" font-size="17" text-anchor="start" class="h" >Floorplan</text><text x="500" y="130" font-size="12" text-anchor="start" class="ink2" >1670.2 x 1455.52 um</text><text x="500" y="148" font-size="12" text-anchor="start" class="h fg" >Pixelstorm: yes</text><line x1="630" y1="120" x2="642" y2="120" class="lnd" stroke-width="1.6" marker-end="url(#ah)" /><rect x="644" y="80" width="140" height="80" rx="8" class="ta" stroke-width="1.6"/><text x="656" y="108" font-size="17" text-anchor="start" class="h" >Placement</text><text x="656" y="130" font-size="12" text-anchor="start" class="ink2" >58% utilization</text><text x="656" y="148" font-size="12" text-anchor="start" class="h fg" >Pixelstorm: yes</text><line x1="786" y1="120" x2="798" y2="120" class="lnd" stroke-width="1.6" marker-end="url(#ah)" /><rect x="800" y="80" width="140" height="80" rx="8" class="box" stroke-dasharray="6 4" stroke-width="1.6"/><text x="812" y="108" font-size="17" text-anchor="start" class="h" >Clock tree</text><text x="812" y="130" font-size="12" text-anchor="start" class="ink2" >OpenROAD</text><text x="812" y="148" font-size="12" text-anchor="start" class="h ink3" >exercise</text><rect x="20" y="198" width="140" height="80" rx="8" class="box" stroke-dasharray="6 4" stroke-width="1.6"/><text x="32" y="226" font-size="17" text-anchor="start" class="h" >Routing</text><text x="32" y="248" font-size="12" text-anchor="start" class="ink2" >OpenROAD</text><text x="32" y="266" font-size="12" text-anchor="start" class="h ink3" >exercise</text><line x1="162" y1="238" x2="174" y2="238" class="lnd" stroke-width="1.6" marker-end="url(#ah)" /><rect x="176" y="198" width="140" height="80" rx="8" class="box" stroke-dasharray="6 4" stroke-width="1.6"/><text x="188" y="226" font-size="17" text-anchor="start" class="h" >Sign-off</text><text x="188" y="248" font-size="12" text-anchor="start" class="ink2" >DRC, LVS, timing</text><text x="188" y="266" font-size="12" text-anchor="start" class="h ink3" >exercise</text><line x1="318" y1="238" x2="330" y2="238" class="lnd" stroke-width="1.6" marker-end="url(#ah)" /><rect x="332" y="198" width="140" height="80" rx="8" class="tm" stroke-width="1.6"/><text x="344" y="226" font-size="17" text-anchor="start" class="h" >GDS</text><text x="344" y="248" font-size="12" text-anchor="start" class="ink2" >KLayout</text><text x="344" y="266" font-size="12" text-anchor="start" class="h fg" >Pixelstorm: yes</text><line x1="474" y1="238" x2="486" y2="238" class="lnd" stroke-width="1.6" marker-end="url(#ah)" /><rect x="488" y="198" width="140" height="80" rx="8" class="tv" stroke-width="1.6"/><text x="500" y="226" font-size="17" text-anchor="start" class="h" >Fab</text><text x="500" y="248" font-size="12" text-anchor="start" class="ink2" >SkyWater 130 nm</text><text x="500" y="266" font-size="12" text-anchor="start" class="h ink3" >industry</text><line x1="630" y1="238" x2="642" y2="238" class="lnd" stroke-width="1.6" marker-end="url(#ah)" /><rect x="644" y="198" width="140" height="80" rx="8" class="tv" stroke-width="1.6"/><text x="656" y="226" font-size="17" text-anchor="start" class="h" >Package</text><text x="656" y="248" font-size="12" text-anchor="start" class="ink2" >bond, test</text><text x="656" y="266" font-size="12" text-anchor="start" class="h ink3" >industry</text><path d="M 800 160 C 820 185, 40 180, 20 198" class="lnd" stroke-width="1.4" fill="none" marker-end="url(#ah)" stroke-dasharray="4 4"/>
