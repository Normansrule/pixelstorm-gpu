<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" role="img" aria-label="Pixelstorm top-level block diagram">
<title>Pixelstorm top-level block diagram</title>
<style>
  .bg{fill:#F7F9FB} .panel{fill:#FFFFFF;stroke:#C9D1DA} .well{fill:#EEF2F6} .box{fill:#EEF2F6;stroke:#C9D1DA;stroke-width:1.2}
  .ink{fill:#182231} .ink2{fill:#4A5566} .ink3{fill:#7C8898} .ln{stroke:#C9D1DA;fill:none} .lnd{stroke:#4A5566;fill:none}
  .fb{fill:#2B57E0} .fg{fill:#13936A} .fa{fill:#D99A06} .fm{fill:#C8325F} .fv{fill:#7A4FD6} .fs{fill:#6B7A90} .fw{fill:#FFFFFF}
  .sb{stroke:#2B57E0;fill:none} .sg{stroke:#13936A;fill:none} .sa{stroke:#D99A06;fill:none} .sm{stroke:#C8325F;fill:none} .sv{stroke:#7A4FD6;fill:none}
  .tb{fill:rgba(43,87,224,.12);stroke:#2B57E0} .tg{fill:rgba(19,147,106,.16);stroke:#13936A} .ta{fill:rgba(217,154,6,.18);stroke:#D99A06}
  .tm{fill:rgba(200,50,95,.12);stroke:#C8325F} .tv{fill:rgba(122,79,214,.14);stroke:#7A4FD6} .ts{fill:rgba(107,122,144,.14);stroke:#6B7A90}
  text{font-family:'Barlow','Segoe UI',Helvetica,Arial,sans-serif;fill:#182231}
  .h{font-family:'Barlow Condensed','Arial Narrow','Segoe UI',sans-serif;font-weight:600}
  .mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
  .w{fill:#FFFFFF}
  @media (prefers-color-scheme: dark){
    .bg{fill:#16202A} .panel{fill:#0F151C;stroke:#2A3845} .well{fill:#1C2733} .box{fill:#1C2733;stroke:#2A3845}
    .ink,text{fill:#E3E9EF} .ink2{fill:#9AA8B8} .ink3{fill:#6D7C8C} .ln{stroke:#2A3845} .lnd{stroke:#9AA8B8}
    .fb{fill:#5B84FF} .fg{fill:#2DBE8C} .fa{fill:#F0B429} .fm{fill:#E5587F} .fv{fill:#A07DF0} .fs{fill:#8594A8}
    .sb{stroke:#5B84FF} .sg{stroke:#2DBE8C} .sa{stroke:#F0B429} .sm{stroke:#E5587F} .sv{stroke:#A07DF0}
    .tb{fill:rgba(91,132,255,.18);stroke:#5B84FF} .tg{fill:rgba(45,190,140,.18);stroke:#2DBE8C} .ta{fill:rgba(240,180,41,.18);stroke:#F0B429}
    .tm{fill:rgba(229,88,127,.16);stroke:#E5587F} .tv{fill:rgba(160,125,240,.18);stroke:#A07DF0} .ts{fill:rgba(133,148,168,.18);stroke:#8594A8}
    .w{fill:#0F151C}
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink2"/></marker>
  <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fa"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fb"/></marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="well"/><line x1="0" y1="0" x2="0" y2="6" class="lnd" stroke-width="1" opacity=".5"/></pattern>
</defs>
<rect width="960" height="570" class="bg"/>
<text x="20" y="32" font-size="22" text-anchor="start" class="h" >Pixelstorm GPU: top level (rtl/ps_gpu_top.v)</text><text x="20" y="52" font-size="13" text-anchor="start" class="ink2" >Everything inside the dashed outline is synthesizable Verilog. The host and DRAM live in the testbench (sim/tb_gpu.v).</text><rect x="210" y="70" width="745" height="330" rx="10" class="ln" fill="none" stroke-dasharray="6 4" stroke-width="1.5"/><text x="222" y="90" font-size="12" text-anchor="start" class="mono ink3" >ps_gpu_top</text><rect x="20" y="110" width="160" height="140" rx="6" class="tb" /><text x="30" y="130" font-size="16" text-anchor="start" class="h" >Host (CPU)</text><text x="30" y="150" font-size="12.5" text-anchor="start" class="ink2" >driver in tb_gpu.v</text><text x="30" y="167" font-size="12.5" text-anchor="start" class="mono ink2" >upload program</text><text x="30" y="184" font-size="12.5" text-anchor="start" class="mono ink2" >write kernel args</text><text x="30" y="201" font-size="12.5" text-anchor="start" class="mono ink2" >pulse launch</text><line x1="180" y1="150" x2="236" y2="150" class="sb" stroke-width="1.8" marker-end="url(#ahb)" /><line x1="180" y1="200" x2="236" y2="200" class="sb" stroke-width="1.8" marker-end="url(#ahb)" /><path d="M180,235 L220,235 L220,300 L238,300" class="sb" stroke-width="1.8" fill="none" marker-end="url(#ahb)" /><rect x="240" y="110" width="160" height="64" rx="6" class="box" /><text x="250" y="130" font-size="16" text-anchor="start" class="h" >Instruction memory</text><text x="250" y="150" font-size="12.5" text-anchor="start" class="ink2" >1,024 x 32 bit</text><rect x="240" y="180" width="160" height="64" rx="6" class="box" /><text x="250" y="200" font-size="16" text-anchor="start" class="h" >Constant bank</text><text x="250" y="220" font-size="12.5" text-anchor="start" class="ink2" >16 words: c[0..15]</text><rect x="240" y="262" width="160" height="76" rx="6" class="tb" /><text x="250" y="282" font-size="16" text-anchor="start" class="h" >Block dispatcher</text><text x="250" y="302" font-size="12.5" text-anchor="start" class="ink2" >ps_dispatcher.v</text><text x="250" y="319" font-size="12.5" text-anchor="start" class="mono ink2" >one block / cycle</text><rect x="440" y="110" width="300" height="180" rx="8" class="panel" /><text x="452" y="132" font-size="16" text-anchor="start" class="h" >Streaming Multiprocessor 0</text><text x="728" y="132" font-size="11.5" text-anchor="end" class="mono ink3" >ps_sm.v</text><rect x="452" y="144" width="86" height="60" rx="5" class="tb" /><text x="460" y="164" font-size="13.5" text-anchor="start" class="h" >Warp</text><text x="460" y="180" font-size="13.5" text-anchor="start" class="h" >scheduler</text><text x="460" y="196" font-size="11.5" text-anchor="start" class="ink2" >4 warps</text><rect x="546" y="144" width="182" height="60" rx="5" class="tg" /><text x="554" y="162" font-size="13.5" text-anchor="start" class="h" >8 lanes (ps_alu x 8)</text><rect x="554" y="170" width="17" height="26" rx="3" class="fg" opacity=".8"/><rect x="575" y="170" width="17" height="26" rx="3" class="fg" opacity=".8"/><rect x="596" y="170" width="17" height="26" rx="3" class="fg" opacity=".8"/><rect x="617" y="170" width="17" height="26" rx="3" class="fg" opacity=".8"/><rect x="638" y="170" width="17" height="26" rx="3" class="fg" opacity=".8"/><rect x="659" y="170" width="17" height="26" rx="3" class="fg" opacity=".8"/><rect x="680" y="170" width="17" height="26" rx="3" class="fg" opacity=".8"/><rect x="701" y="170" width="17" height="26" rx="3" class="fg" opacity=".8"/><rect x="452" y="212" width="86" height="66" rx="5" class="box" /><text x="460" y="232" font-size="13.5" text-anchor="start" class="h" >Register</text><text x="460" y="248" font-size="13.5" text-anchor="start" class="h" >file 2 KB</text><text x="460" y="266" font-size="11.5" text-anchor="start" class="ink2" >+ predicates</text><rect x="546" y="212" width="86" height="66" rx="5" class="ta" /><text x="554" y="232" font-size="13.5" text-anchor="start" class="h" >Load/store</text><text x="554" y="248" font-size="13.5" text-anchor="start" class="h" >unit</text><text x="554" y="266" font-size="11.5" text-anchor="start" class="ink2" >coalescer</text><rect x="640" y="212" width="88" height="66" rx="5" class="ta" /><text x="648" y="232" font-size="13.5" text-anchor="start" class="h" >Shared</text><text x="648" y="248" font-size="13.5" text-anchor="start" class="h" >memory</text><text x="648" y="266" font-size="11.5" text-anchor="start" class="ink2" >8 banks</text><line x1="400" y1="142" x2="440" y2="170" class="lnd" stroke-width="1.2" marker-end="url(#ah)" /><line x1="400" y1="212" x2="440" y2="186" class="lnd" stroke-width="1.2" marker-end="url(#ah)" /><line x1="400" y1="300" x2="440" y2="240" class="sb" stroke-width="1.8" marker-end="url(#ahb)" /><path d="M740,245 L780,245 L780,280 L798,280" class="sa" stroke-width="2" fill="none" marker-end="url(#aha)" /><rect x="440" y="310" width="300" height="180" rx="8" class="panel" /><text x="452" y="332" font-size="16" text-anchor="start" class="h" >Streaming Multiprocessor 1</text><text x="728" y="332" font-size="11.5" text-anchor="end" class="mono ink3" >ps_sm.v</text><rect x="452" y="344" width="86" height="60" rx="5" class="tb" /><text x="460" y="364" font-size="13.5" text-anchor="start" class="h" >Warp</text><text x="460" y="380" font-size="13.5" text-anchor="start" class="h" >scheduler</text><text x="460" y="396" font-size="11.5" text-anchor="start" class="ink2" >4 warps</text><rect x="546" y="344" width="182" height="60" rx="5" class="tg" /><text x="554" y="362" font-size="13.5" text-anchor="start" class="h" >8 lanes (ps_alu x 8)</text><rect x="554" y="370" width="17" height="26" rx="3" class="fg" opacity=".8"/><rect x="575" y="370" width="17" height="26" rx="3" class="fg" opacity=".8"/><rect x="596" y="370" width="17" height="26" rx="3" class="fg" opacity=".8"/><rect x="617" y="370" width="17" height="26" rx="3" class="fg" opacity=".8"/><rect x="638" y="370" width="17" height="26" rx="3" class="fg" opacity=".8"/><rect x="659" y="370" width="17" height="26" rx="3" class="fg" opacity=".8"/><rect x="680" y="370" width="17" height="26" rx="3" class="fg" opacity=".8"/><rect x="701" y="370" width="17" height="26" rx="3" class="fg" opacity=".8"/><rect x="452" y="412" width="86" height="66" rx="5" class="box" /><text x="460" y="432" font-size="13.5" text-anchor="start" class="h" >Register</text><text x="460" y="448" font-size="13.5" text-anchor="start" class="h" >file 2 KB</text><text x="460" y="466" font-size="11.5" text-anchor="start" class="ink2" >+ predicates</text><rect x="546" y="412" width="86" height="66" rx="5" class="ta" /><text x="554" y="432" font-size="13.5" text-anchor="start" class="h" >Load/store</text><text x="554" y="448" font-size="13.5" text-anchor="start" class="h" >unit</text><text x="554" y="466" font-size="11.5" text-anchor="start" class="ink2" >coalescer</text><rect x="640" y="412" width="88" height="66" rx="5" class="ta" /><text x="648" y="432" font-size="13.5" text-anchor="start" class="h" >Shared</text><text x="648" y="448" font-size="13.5" text-anchor="start" class="h" >memory</text><text x="648" y="466" font-size="11.5" text-anchor="start" class="ink2" >8 banks</text><line x1="400" y1="142" x2="440" y2="370" class="lnd" stroke-width="1.2" marker-end="url(#ah)" /><line x1="400" y1="212" x2="440" y2="386" class="lnd" stroke-width="1.2" marker-end="url(#ah)" /><line x1="400" y1="300" x2="440" y2="440" class="sb" stroke-width="1.8" marker-end="url(#ahb)" /><path d="M740,445 L780,445 L780,320 L798,320" class="sa" stroke-width="2" fill="none" marker-end="url(#aha)" /><rect x="800" y="240" width="148" height="110" rx="6" class="ta" /><text x="810" y="260" font-size="16" text-anchor="start" class="h" >Memory arbiter</text><text x="810" y="280" font-size="12.5" text-anchor="start" class="ink2" >ps_mem_arbiter.v</text><text x="810" y="297" font-size="12.5" text-anchor="start" class="mono ink2" >round robin</text><text x="810" y="314" font-size="12.5" text-anchor="start" class="mono ink2" >one request</text><line x1="875" y1="350" x2="875" y2="418" class="sa" stroke-width="2.2" marker-end="url(#aha)" /><rect x="760" y="420" width="180" height="90" rx="6" class="ta" /><text x="770" y="440" font-size="16" text-anchor="start" class="h" >DRAM model</text><text x="770" y="460" font-size="12.5" text-anchor="start" class="ink2" >global memory 64K words</text><text x="770" y="477" font-size="12.5" text-anchor="start" class="mono ink2" >latency +lat (8)</text><text x="770" y="494" font-size="12.5" text-anchor="start" class="mono ink2" >4-word lines</text><text x="20" y="548" font-size="13" text-anchor="start" class="ink2" >Blue: control and dispatch.  Green: arithmetic lanes.  Amber: memory path.  Real GPUs replicate the SM tile 100+ times; here NUM_SMS = 2.</text>
</svg>
