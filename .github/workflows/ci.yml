name: test
on: [push, pull_request]
jobs:
  rtl-vs-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - run: node tools/pixelstorm.js test
      - run: make lint
      - run: node tools/figures.js
      - name: docs are in sync with the source
        run: python3 tools/rtl_chapter.py && python3 tools/silicon/chapter.py && python3 tools/course.py && git diff --exit-code docs/
